[project]
name = "mpp"
version = "0.1.0"
description = "Bayesian hierarchical football forecasting for the 2026 World Cup, with walk-forward back-testing"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "requests>=2.28",
    "pymc>=5.28.5",
    "arviz>=0.23.4",
    "matplotlib>=3.10.9",
]

[project.scripts]
mpp-predict = "mpp.predict:main"
mpp-optimize = "mpp.optimize:main"
mpp-site = "mpp.site:main"
mpp-backtest = "mpp.backtest:main"
mpp-backtest-report = "mpp.backtest:main_report"
mpp-market = "mpp.market:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.16",
]
